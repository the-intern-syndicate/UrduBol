<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اردو بول – UrduBol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="py-6 px-4 sm:px-8">

  <div class="mx-auto flex max-w-5xl flex-col gap-5 min-h-[90vh]">
    
    <!-- Header -->
    <header class="glass-card flex flex-wrap items-center justify-between gap-4 px-6 py-4">
      <div class="flex items-center gap-4">
        <div class="grid h-12 w-12 place-items-center rounded-2xl bg-[#064E3B] text-[#FAF6F0] shadow-sm">
          <span class="nastaliq text-2xl leading-none pt-1">بول</span>
        </div>
        <div>
          <h1 class="nastaliq text-2xl font-bold text-[#064E3B] leading-snug">اردو لیکچر ٹرانسکرائبر</h1>
          <p class="text-xs text-[#5C7066] -mt-1 font-sans">اردو بول · UrduBol — COMSATS</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span class="badge-blush rounded-full px-3.5 py-1 text-xs font-semibold" dir="ltr">Whisper + CTranslate2</span>
        <span class="badge-champagne rounded-full px-3.5 py-1 text-xs font-medium">تاخیر: <span id="latency-badge" class="font-mono font-bold text-[#064E3B]">— ms</span></span>
      </div>
    </header>

    <!-- Controls Toolbar -->
    <section class="glass-card flex flex-wrap items-center gap-4 p-4">
      <button id="toggle-mic-btn" class="btn-emerald flex items-center gap-3 rounded-full px-7 py-3 text-base font-semibold shadow-sm cursor-pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
        <span id="btn-text">ریکارڈنگ شروع کریں</span>
        <span id="recording-dot" class="w-2.5 h-2.5 rounded-full bg-white hidden"></span>
      </button>

      <!-- Waveform Canvas -->
      <div class="relative min-w-[180px] flex-1 overflow-hidden rounded-2xl bg-[#F5E9D4] border border-[#EADDC8]" style="height: 52px;">
        <canvas id="wave-canvas" class="h-full w-full"></canvas>
      </div>

      <button id="export-btn" class="btn-ghost flex items-center gap-2 rounded-full px-5 py-3 text-sm font-semibold cursor-pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
        ٹرانسکرپٹ برآمد کریں
      </button>
    </section>

    <!-- Transcript Box -->
    <main class="glass-card relative flex-1 min-h-[380px] flex flex-col">
      <!-- Floating Quick Actions -->
      <div class="absolute start-4 top-4 z-10 flex gap-2">
        <button id="copy-btn" class="btn-ghost fab-btn" title="کاپی"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
        <button id="download-btn" class="btn-ghost fab-btn" title="TXT ڈاؤن لوڈ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg></button>
        <button id="clear-btn" class="btn-ghost fab-btn" title="صاف کریں"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>

      <div id="transcript-container" class="h-full overflow-y-auto px-6 pb-8 pt-16 sm:px-10 max-h-[50vh]">
        <p id="placeholder-text" class="nastaliq text-[#5C7066] text-xl leading-loose">مائیکرو فون آن کریں اور بولنا شروع کریں...</p>
      </div>
    </main>

    <!-- Footer Stats -->
    <footer class="glass-card grid grid-cols-3 divide-x divide-x-reverse divide-[#EADDC8] px-2 py-3 text-center">
      <div class="px-2">
        <div class="text-xs text-[#5C7066]">کل دورانیہ</div>
        <div id="lecture-timer" class="font-mono text-lg font-bold text-[#064E3B]">00:00:00</div>
      </div>
      <div class="px-2">
        <div class="text-xs text-[#5C7066]">الفاظ</div>
        <div id="word-count" class="font-mono text-lg font-bold text-[#064E3B]">0</div>
      </div>
      <div class="px-2">
        <div class="text-xs text-[#5C7066]">ماڈل کی حالت</div>
        <div class="flex items-center justify-center gap-2 text-sm font-semibold text-[#064E3B]">
          <span id="model-dot" class="w-2.5 h-2.5 rounded-full bg-[#10B981]"></span>
          <span id="model-health">CTranslate2 تیار</span>
        </div>
      </div>
    </footer>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
